channels:
  - bioconda
  - conda-forge
  - r
  - sagrudd
dependencies:
  - git
  - git-lfs
  - snakemake-minimal =5.2.4
  - python =3.6
  - pysam
  - htslib
  - samtools
  - minimap2
  - r-essentials
  - r =3.5.1
  - rstudio
  - nanopore-r-cdna-deseq2
  - openjdk =10 # Module java.xml.bind deprecated in latest versions; dependency for IGV
  - gffcompare
  - gffread
  - igv =2.4.9  # version 2.4.16 places igv.jar into wrong directory
  - xorg-libxext
  - xorg-libxtst
  - racon
  - r-pdftools
  - parasail-python
  - graphviz
  - racon=1.3.2=h9b26653_1  # this is @sagrudd's version - clever SIMD instructions removed
  - pinfish=190125=b6f3c06_3
  - mosdepth
  - zlib
  # eMudhra CA incident (2026-10-20, #3): fixed CA bundle from conda-forge.
  # certifi>=2026.10.19 needs python >=3.10 and openjdk has no fixed build: both BLOCKED.
  - conda-forge::ca-certificates >=2026.10.19
  - pip
  - pip:
    - "--editable=git+https://github.com/nanoporetech/pychopper.git#egg=pychopper"
    - "--editable=git+https://github.com/nanoporetech/wub.git#egg=wub"

